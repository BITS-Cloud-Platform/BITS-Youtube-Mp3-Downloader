services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/downloads.db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/storage
      - YTDL_FORMAT=m4a
      - ALLOWED_ORIGINS=http://localhost:3000
      - PASSWORD_MIN_LENGTH=8
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A tasks worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=sqlite:////app/data/downloads.db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/storage
      - YTDL_FORMAT=m4a
      - ALLOWED_ORIGINS=http://localhost:3000
      - PASSWORD_MIN_LENGTH=8
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    depends_on:
      - backend
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  app_data:
  app_storage:
  redis_data:

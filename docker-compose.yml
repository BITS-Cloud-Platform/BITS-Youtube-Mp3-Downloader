x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Pin compose project name so CLI runs and Arcane deployments
# always target the same containers/network (prevents duplicates).
name: bitsyoutubemp3downloader

services:
  nginx:
    image: nginx:stable-alpine
    pull_policy: always
    ports:
      - "3004:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    image: ghcr.io/bits-cloud-platform/ytmp3-frontend:latest
    pull_policy: always
    env_file:
      - path: .env.production
        required: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app-network

  backend:
    image: ghcr.io/bits-cloud-platform/ytmp3-backend:latest
    pull_policy: always
    env_file:
      - path: .env.production
        required: false
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/openapi.json',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app-network

  worker:
    image: ghcr.io/bits-cloud-platform/ytmp3-backend:latest
    pull_policy: always
    command: celery -A tasks worker --loglevel=info --concurrency=2
    env_file:
      - path: .env.production
        required: false
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil;exit(0 if any('celery' in ' '.join(p.cmdline()) for p in psutil.process_iter()) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:latest
    pull_policy: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped
    networks:
      - app-network

volumes:
  app_data:
    name: bitsyoutubemp3downloader_app_data
  app_storage:
    name: bitsyoutubemp3downloader_app_storage
  redis_data:
    name: bitsyoutubemp3downloader_redis_data

networks:
  app-network:
    name: bitsyoutubemp3downloader-network
    driver: bridge

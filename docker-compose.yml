services:
  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    ports:
      - "3004:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ytmp3-network

  frontend:
    image: ghcr.io/bits-cloud-platform/ytmp3-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://ytmp3.bits.co.id
    ports: []
    env_file:
      - path: .env.production
        required: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ytmp3-network

  backend:
    image: ghcr.io/bits-cloud-platform/ytmp3-backend:latest
    build: ./backend
    ports: []
    env_file:
      - path: .env.production
        required: false
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/openapi.json',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ytmp3-network

  worker:
    image: ghcr.io/bits-cloud-platform/ytmp3-backend:latest
    build: ./backend
    command: celery -A tasks worker --loglevel=info --concurrency=2
    env_file:
      - path: .env.production
        required: false
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil;exit(0 if any('celery' in ' '.join(p.cmdline()) for p in psutil.process_iter()) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ytmp3-network

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ytmp3-network

volumes:
  app_data:
  app_storage:
  redis_data:

networks:
  ytmp3-network:
    driver: bridge

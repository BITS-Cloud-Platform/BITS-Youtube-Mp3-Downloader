services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://ytmp3.bits.co.id
    ports:
      - "3004:3000"
    env_file:
      - .env.production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ytmp3-network

  backend:
    build: ./backend
    ports: []
    env_file:
      - .env.production
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - ytmp3-network

  worker:
    build: ./backend
    command: celery -A tasks worker --loglevel=info --concurrency=2
    env_file:
      - .env.production
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    depends_on:
      - backend
      - redis
    restart: unless-stopped
    networks:
      - ytmp3-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ytmp3-network

volumes:
  app_data:
  app_storage:
  redis_data:

networks:
  ytmp3-network:
    driver: bridge

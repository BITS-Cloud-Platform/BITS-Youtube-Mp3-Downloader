name: "🚀 Build & Ship"

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: "⚙️ Build Backend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Setup Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "🔐 Login GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🚀 Build & Push"
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/bits-cloud-platform/ytmp3-backend:latest
            ghcr.io/bits-cloud-platform/ytmp3-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: "🎨 Build Frontend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "🏗️ Setup Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "🔐 Login GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🚀 Build & Push"
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://ytmp3.bits.co.id
          tags: |
            ghcr.io/bits-cloud-platform/ytmp3-frontend:latest
            ghcr.io/bits-cloud-platform/ytmp3-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
